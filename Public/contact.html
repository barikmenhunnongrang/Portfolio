<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | My Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav" class="nav"></nav>

  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Get in touch</p>
      <h1>Contact</h1>
      <p class="lead">Reach out directly, or leave a note about how the website felt.</p>
    </header>

    <section id="contactInfo" class="contact-grid">
      <p class="message">Loading...</p>
    </section>

    <section class="card" id="feedbackCard">
      <h2>Website feedback</h2>
      <p class="muted">How was your experience on this website?</p>

      <form id="feedbackForm" novalidate>
        <div class="stars" role="radiogroup" aria-label="Rating">
          <input type="radio" name="rating" id="star5" value="5" /><label for="star5" title="5 stars" aria-label="5 stars">&#9733;</label>
          <input type="radio" name="rating" id="star4" value="4" /><label for="star4" title="4 stars" aria-label="4 stars">&#9733;</label>
          <input type="radio" name="rating" id="star3" value="3" /><label for="star3" title="3 stars" aria-label="3 stars">&#9733;</label>
          <input type="radio" name="rating" id="star2" value="2" /><label for="star2" title="2 stars" aria-label="2 stars">&#9733;</label>
          <input type="radio" name="rating" id="star1" value="1" /><label for="star1" title="1 star" aria-label="1 star">&#9733;</label>
        </div>

        <label class="field">Your name (optional)
          <input type="text" id="fbName" maxlength="80" placeholder="Anonymous" autocomplete="name" />
        </label>
        <label class="field">Your feedback
          <textarea id="fbMessage" rows="4" required maxlength="1000" placeholder="What did you like? What could be better?"></textarea>
        </label>

        <p id="fbStatus" class="message" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="fbSubmit">Send feedback</button>
      </form>
    </section>
  </main>

  <footer class="footer">&copy; <span data-year></span> My Portfolio</footer>

  <script src="common.js"></script>
  <script src="contact.js"></script>
</body>
</html>
